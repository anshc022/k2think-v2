<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 20" width="1200" height="20">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="30%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="1"/>
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <filter id="divGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.8"/>
      <stop offset="55%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="0" y1="10" x2="1200" y2="10" stroke="url(#lineGrad)" stroke-width="1" filter="url(#divGlow)"/>
  <!-- Center diamond -->
  <rect x="596" y="6" width="8" height="8" rx="1" transform="rotate(45 600 10)" fill="#a855f7" filter="url(#divGlow)" opacity="0.8"/>
  <!-- Pulse overlay -->
  <line x1="0" y1="10" x2="1200" y2="10" stroke="url(#pulseGrad)" stroke-width="2" opacity="0.6">
    <animate attributeName="x1" from="-1200" to="1200" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="x2" from="0" to="2400" dur="3s" repeatCount="indefinite"/>
  </line>
</svg>