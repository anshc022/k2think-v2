<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="bg1" cx="30%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="bg2" cx="70%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Circuit trace pattern -->
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0L80 80M0 80L80 80" stroke="#6366f1" stroke-opacity="0.06" stroke-width="1" fill="none"/>
    </pattern>
  </defs>
  <!-- Base -->
  <rect width="1920" height="1080" fill="#0a0a0f"/>
  <rect width="1920" height="1080" fill="url(#bg1)"/>
  <rect width="1920" height="1080" fill="url(#bg2)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  
  <!-- Neural network connections -->
  <g stroke="#6366f1" stroke-opacity="0.15" stroke-width="1" fill="none" filter="url(#glow)">
    <line x1="200" y1="150" x2="450" y2="300"/>
    <line x1="450" y1="300" x2="700" y2="200"/>
    <line x1="700" y1="200" x2="950" y2="400"/>
    <line x1="950" y1="400" x2="1200" y2="250"/>
    <line x1="1200" y1="250" x2="1500" y2="350"/>
    <line x1="1500" y1="350" x2="1750" y2="200"/>
    <line x1="300" y1="500" x2="550" y2="650"/>
    <line x1="550" y1="650" x2="800" y2="550"/>
    <line x1="800" y1="550" x2="1050" y2="700"/>
    <line x1="1050" y1="700" x2="1350" y2="600"/>
    <line x1="1350" y1="600" x2="1600" y2="750"/>
    <line x1="450" y1="300" x2="550" y2="650"/>
    <line x1="700" y1="200" x2="800" y2="550"/>
    <line x1="950" y1="400" x2="1050" y2="700"/>
    <line x1="1200" y1="250" x2="1350" y2="600"/>
    <line x1="150" y1="800" x2="400" y2="900"/>
    <line x1="400" y1="900" x2="700" y2="850"/>
    <line x1="700" y1="850" x2="1000" y2="950"/>
    <line x1="1000" y1="950" x2="1300" y2="870"/>
    <line x1="1300" y1="870" x2="1600" y2="950"/>
    <line x1="1600" y1="750" x2="1800" y2="870"/>
    <line x1="550" y1="650" x2="400" y2="900"/>
    <line x1="800" y1="550" x2="700" y2="850"/>
    <line x1="1050" y1="700" x2="1000" y2="950"/>
    <line x1="1350" y1="600" x2="1300" y2="870"/>
  </g>
  
  <!-- Circuit traces -->
  <g stroke="#3b82f6" stroke-opacity="0.08" stroke-width="1" fill="none">
    <path d="M0 400 H300 L350 350 H500"/>
    <path d="M1920 600 H1600 L1550 650 H1400"/>
    <path d="M960 0 V200 L1010 250 V400"/>
    <path d="M0 700 H150 L200 750 H350 L400 700 H500"/>
    <path d="M1920 300 H1700 L1650 350 H1500 L1450 300 H1350"/>
  </g>
  
  <!-- Neural nodes -->
  <g filter="url(#nodeGlow)">
    <circle cx="200" cy="150" r="4" fill="#6366f1" opacity="0.6"/>
    <circle cx="450" cy="300" r="5" fill="#a855f7" opacity="0.5"/>
    <circle cx="700" cy="200" r="3" fill="#3b82f6" opacity="0.7"/>
    <circle cx="950" cy="400" r="6" fill="#6366f1" opacity="0.4"/>
    <circle cx="1200" cy="250" r="4" fill="#a855f7" opacity="0.6"/>
    <circle cx="1500" cy="350" r="5" fill="#3b82f6" opacity="0.5"/>
    <circle cx="1750" cy="200" r="3" fill="#6366f1" opacity="0.7"/>
    <circle cx="300" cy="500" r="3" fill="#3b82f6" opacity="0.5"/>
    <circle cx="550" cy="650" r="5" fill="#6366f1" opacity="0.4"/>
    <circle cx="800" cy="550" r="4" fill="#a855f7" opacity="0.6"/>
    <circle cx="1050" cy="700" r="6" fill="#3b82f6" opacity="0.5"/>
    <circle cx="1350" cy="600" r="4" fill="#6366f1" opacity="0.6"/>
    <circle cx="1600" cy="750" r="5" fill="#a855f7" opacity="0.4"/>
    <circle cx="150" cy="800" r="3" fill="#6366f1" opacity="0.5"/>
    <circle cx="400" cy="900" r="4" fill="#3b82f6" opacity="0.6"/>
    <circle cx="700" cy="850" r="5" fill="#a855f7" opacity="0.4"/>
    <circle cx="1000" cy="950" r="4" fill="#6366f1" opacity="0.5"/>
    <circle cx="1300" cy="870" r="3" fill="#3b82f6" opacity="0.7"/>
    <circle cx="1600" cy="950" r="5" fill="#a855f7" opacity="0.4"/>
    <circle cx="1800" cy="870" r="4" fill="#6366f1" opacity="0.6"/>
  </g>
  
  <!-- Floating particles -->
  <g fill="#a855f7" opacity="0.3">
    <circle cx="100" cy="100" r="1.5"/>
    <circle cx="500" cy="50" r="1"/>
    <circle cx="900" cy="120" r="2"/>
    <circle cx="1400" cy="80" r="1"/>
    <circle cx="1800" cy="150" r="1.5"/>
    <circle cx="250" cy="950" r="1"/>
    <circle cx="850" cy="1000" r="1.5"/>
    <circle cx="1550" cy="980" r="1"/>
    <circle cx="1700" cy="500" r="2"/>
    <circle cx="100" cy="600" r="1"/>
  </g>
</svg>